[build]
  command = "npm run build"
  publish = ".next"

# Excluir el cache de Turbopack del escaneo de secrets (falso positivo).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production]
  environment = { NEXT_PUBLIC_NETLIFY = "true" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
